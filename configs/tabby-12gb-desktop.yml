# 12 GB card, also driving the display: 4.0bpw, Q8 KV, 1 request(s) at a time; generated by tools/recipes.py
model:
  model_name: SenseNova-Loop-9B-exl3-4.0bpw
  max_seq_len: 131072
  cache_size: 131072
  cache_mode: Q8
  chunk_size: 2048
  max_batch_size: 1
  recurrent_state_fp32: true
  warmup: true               # allocate kernels/workspaces at load, not during the first request
  tool_format: qwen3_coder
  vision: true
