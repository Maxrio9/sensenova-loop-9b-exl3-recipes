# 32 GB card, used only for the model: 8.0bpw, Q8 KV, 1 request(s) at a time; generated by tools/recipes.py
model:
  model_name: SenseNova-Loop-9B-exl3-8.0bpw
  max_seq_len: 524288
  cache_size: 630784
  cache_mode: Q8
  chunk_size: 2048
  max_batch_size: 1
  recurrent_state_fp32: true
  warmup: true               # allocate kernels/workspaces at load, not during the first request
  tool_format: qwen3_coder
  vision: true

draft_model:
  draft_mode: mtp            # the model's own MTP head drafts tokens; output is the same, decoding ~2-3x faster
  draft_num_tokens: 4
  draft_cache_mode: Q8
  hybrid_draft_tokens: 7     # also copy repeated passages (edits, quotes) in one pass
  sparse_draft_head: 16384   # draft from the most frequent tokens only; checking still uses all
