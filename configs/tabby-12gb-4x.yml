# 12 GB card, used only for the model: 4.0bpw, Q8 KV, 4 request(s) at a time; generated by tools/recipes.py
model:
  model_name: SenseNova-Loop-9B-exl3-4.0bpw
  max_seq_len: 147456
  cache_size: 147456
  cache_mode: Q8
  chunk_size: 2048
  max_batch_size: 4
  recurrent_state_fp32: true
  warmup: true               # allocate kernels/workspaces at load, not during the first request
  tool_format: qwen3_coder
  vision: true
